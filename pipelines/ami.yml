format_version: 10
pipelines:
  master-ami:
    group: Terraform
    label_template: ${COUNT}
    lock_behavior: none
    display_order: -1
    materials:
      git-36887ae:
        git: https://github.com/Poorna32/master-ami.git
        shallow_clone: false
        auto_update: true
        branch: main
    secure_variables:
      TF_VAR_vault_token: AES:IsBYAm5FqkgJcOHm4xGpZA==:5hWQOBgpXckItg7rgH3cag2p/EOEghfLRxh3XPc7m5E=
    stages:
      - CREATE:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          environment_variables:
            env: dev
          approval:
            type: manual
          jobs:
            terraform-apply:
              tasks:
              - exec: { command: terraform, arguments: [ "init" ] ,run_if: passed}
              - exec: { command: terraform, arguments: [ "apply", "-auto-approve" ] ,run_if: passed}

      - DELETE:
          fetch_materials: true
          keep_artifacts: false
          clean_workspace: false
          environment_variables:
            env: dev
          approval:
            type: manual
          jobs:
            terraform-apply:
              tasks:
                - exec: { command: terraform, arguments: [ "init" ] ,run_if: passed}
                - exec: { command: terraform, arguments: [ "state", "rm", "aws_ami_from_instance.ami" ] ,run_if: passed}
                - exec: { command: terraform, arguments: [ "destroy", "-auto-approve" ] ,run_if: passed}